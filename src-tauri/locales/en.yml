_version: 1
app:
  nombre: Calendar
ventana:
  minimizar: Minimise
  maximizar: Maximise
  cerrar: Close
calendario:
  hoy: Today
  mesAnterior: Previous month
  mesSiguiente: Next month
  cargando: Looking for events…
  actualizar: Refresh
  eventosDelDia: "{0}: {1}"
  todoElDia: All day
  sinTitulo: (untitled)
  recurring: Repeats
  shownOnce: "The repeat rule couldn't be read: it only shows on the day it starts."
  escritoEn: "Written in {0} time"
  zonaEtiqueta: "Calendar time zone"
  zonaAyuda: "Which clock the events are shown in"
  zonaDelSistema: "System"
  zonaBuscar: "Search a zone…"
  zonaSinResultados: "No zone matches"
  viendoEn: "Showing {0} time"
  masEventosOne: "+{0} more event"
  masEventosOther: "+{0} more events"
  sinEventos: No events
  conEventos: "{0}, has events"
cuentas:
  titulo: Accounts
  calendarios: Calendars
  categorias: Categories
  sinCuentasTitulo: No calendars yet
  sinCuentasDescripcion: Connect an account from Settings and its calendars will show up here.
  necesitaReconectarse: It needs to be connected again from Settings
  noSePudoLeerTodo: Some things could not be read
# The buttons that move between columns when the window is narrow.
sync:
  pending: Waiting to sync
  syncing: Syncing…
  synced: Up to date
  syncedAt: "Up to date · {0}"
  failed: "Could not sync: {0}"
  unavailable: "Not available: {0}"
  request:
    denied: You did not allow syncing this account
    too_soon: Just refreshed; you can refresh again in a moment
    unavailable: The sync service is not running
    failed: Could not request a sync
# The view switcher: day, N days, week, month, year and agenda.
view:
  label: View
  day: Day
  days: "{0} days"
  week: Week
  month: Month
  year: Year
  agenda: Agenda
nav:
  accounts: Accounts
  month: Month
  previous: Previous
  next: Next
# The month as a list, with a narrow window.
agenda:
  today: "Today · {0}"
  range: "{0} – {1}"
  from: "From {0}"
  until: "Until {0}"
  nothing: Nothing today
  empty: No events this month
  emptyNote: Use the arrows above to go to another month.
# The "no permission" state for reading the stored calendar, with the button
# that reopens the vasak-permissions dialog (store wave 2).
permiso:
  titulo: No permission to see the calendar
  descripcion: You didn't grant permission to read the calendar stored on the system. Ask for it again so the dialog shows up.
  pedir: Ask for permission again
  # When the dialog couldn't even be reopened.
  limite: You just asked a moment ago; wait a minute and try again.
  denegado: This permission can't be asked for again.
  error: Couldn't ask for permission again.
# The form for creating, editing and deleting an event.
editor:
  crear: Add event
  tituloCrear: New event
  tituloEditar: Event
  titulo: Title
  tituloPlaceholder: Event name
  calendario: Calendar
  todoElDia: All day
  comienzo: Start
  fin: End
  ubicacion: Location
  ubicacionPlaceholder: Where it is
  descripcion: Description
  guardar: Save
  cancelar: Cancel
  borrar: Delete
  borrarConfirmar: Yes, delete
  # Editing is paused until the store exposes the event's ETag.
  pendiente: "This event can't be edited yet: wait for it to sync."
  # When the event has no id that would let it be deleted.
  noSePuede: The event could not be identified.
  faltaTitulo: Enter a title.
  faltaCalendario: Choose a calendar.
  fechaInvalida: Check the dates.
  rangoInvalido: The event ends before it starts.
# The per-event sync indicator, in the month, agenda and columns views.
sincronizacion:
  pendiente: Not synced
  conflicto: In conflict
# The conflict resolution view: the local version and the server's, with the two
# actions to resolve it.
conflicto:
  titulo: Resolve conflict
  tituloEvento: This event is in conflict
  descripcionEvento: Your version and the server's don't match. Resolve it to be able to edit it.
  tituloTarea: This task is in conflict
  descripcionTarea: Your version and the server's don't match. Resolve it to be able to edit it.
  resolver: Resolve
  ayuda: Choose which version to keep. The other one is discarded.
  local: My version
  servidor: Server version
  mantenerLaMia: Keep mine
  tomarLaDelServidor: Take the server's
  servidorNoDisponible: The server copy isn't available yet. Close and try again later.
  reintentarNota: Close and try again later.
  borradoLocal: Your change is to delete this event.
  cargando: Fetching both versions…
  noSePudoCargar: Could not fetch the comparison
  yaResuelto: This conflict is already resolved.
  cerrar: Close
  campoResumen: Title
  campoComienzo: Start
  campoFin: End
  campoUbicacion: Location
# The part switcher: the calendar or the tasks.
modo:
  label: Part
  calendario: Calendar
  tareas: Tasks
# The tasks view: the list and the create, edit and delete form.
tareas:
  crear: Add task
  tituloCrear: New task
  tituloEditar: Task
  titulo: Title
  tituloPlaceholder: Task name
  lista: List
  estadoLabel: Status
  prioridadLabel: Priority
  conVencimiento: Has due date
  todoElDia: All day
  vencimiento: Due date
  descripcion: Description
  guardar: Save
  cancelar: Cancel
  borrar: Delete
  borrarConfirmar: Yes, delete
  verCompletadas: Show completed
  cargando: Looking for tasks…
  completar: Mark as done
  sinTitulo: (no title)
  # Editing is paused until the store exposes the task's ETag.
  pendiente: "This task can't be edited yet: wait for it to sync."
  # When the task has no id that would let it be edited or deleted.
  noSePuede: The task could not be identified.
  faltaTitulo: Enter a title.
  faltaCalendario: Choose a list.
  fechaInvalida: Check the due date.
  # When the store has no task lists yet.
  sinListasTitulo: There are no task lists yet
  sinListasNota: Connect an account with tasks from Settings and they'll show up here.
  # When there are lists but no tasks.
  vacioTitulo: No tasks
  vacioNota: Add one with the button above.
  vacioPendientesNota: No pending tasks. Turn on "Show completed" to see the done ones.
  # The four states of a task.
  estado:
    NEEDS-ACTION: Pending
    IN-PROCESS: In progress
    COMPLETED: Completed
    CANCELLED: Cancelled
  # The priorities that can be chosen.
  prioridad:
    none: No priority
    high: High
    medium: Medium
    low: Low
