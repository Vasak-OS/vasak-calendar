_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Calendario
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
calendario:
  hoy: Hoy
  mesAnterior: Mes anterior
  mesSiguiente: Mes siguiente
  cargando: Buscando eventos…
  actualizar: Actualizar
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  eventosDelDia: "{0}: {1}"
  todoElDia: Todo el día
  sinTitulo: (sin título)
  recurring: Se repite
  # Decirlo es parte de la función: una serie que se ve una sola vez, sin
  # avisar, hace creer que las demás semanas están libres.
  shownOnce: "La regla de repetición no se pudo leer: se muestra sólo el día que empieza."
  escritoEn: "Escrito en la hora de {0}"
  zonaEtiqueta: "Zona horaria de la agenda"
  zonaAyuda: "En qué hora se muestran los eventos"
  zonaDelSistema: "La del sistema"
  zonaBuscar: "Buscar una zona…"
  zonaSinResultados: "Ninguna zona coincide"
  viendoEn: "Viendo la hora de {0}"
  masEventosOne: "+{0} evento más"
  masEventosOther: "+{0} eventos más"
  sinEventos: Sin eventos
  conEventos: "{0}, con eventos"
cuentas:
  titulo: Cuentas
  calendarios: Calendarios
  categorias: Categorías
  sinCuentasTitulo: Todavía no hay ningún calendario
  sinCuentasDescripcion: Conectá una cuenta desde Configuración y sus calendarios aparecen acá.
  necesitaReconectarse: Hay que volver a conectarla desde Configuración
  noSePudoLeerTodo: No se pudo leer todo
# Cómo va la sincronización de cada cuenta, en el panel de cuentas.
sync:
  pending: Esperando para sincronizar
  syncing: Sincronizando…
  synced: Al día
  syncedAt: "Al día · {0}"
  failed: "No se pudo sincronizar: {0}"
  unavailable: "No disponible: {0}"
  request:
    denied: No diste permiso para sincronizar esta cuenta
    too_soon: Se acaba de actualizar; en un momento se puede de nuevo
    unavailable: El servicio de sincronización no está funcionando
    failed: No se pudo pedir la sincronización
# El selector de vista: día, N días, semana, mes, año y agenda.
view:
  label: Vista
  day: Día
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  days: "{0} días"
  week: Semana
  month: Mes
  year: Año
  agenda: Agenda
# Los botones de ir y volver entre columnas (con la ventana angosta) y entre
# períodos (las flechas, cuando la vista no es el mes).
nav:
  accounts: Cuentas
  month: Mes
  previous: Anterior
  next: Siguiente
# El mes como lista, con la ventana angosta.
agenda:
  today: "Hoy · {0}"
  range: "{0} – {1}"
  from: "Desde las {0}"
  until: "Hasta las {0}"
  nothing: Nada para hoy
  empty: No hay eventos este mes
  emptyNote: Con las flechas de arriba se pasa a otro mes.
# El estado de «sin permiso» para leer el calendario del almacén, con el botón
# que vuelve a abrir el diálogo de `vasak-permissions` (ola 2 del almacén).
permiso:
  titulo: Sin permiso para ver el calendario
  descripcion: No diste permiso para leer el calendario guardado en el sistema. Volvé a pedirlo para que aparezca el diálogo.
  pedir: Pedir permiso de nuevo
  # Cuando no se pudo ni volver a abrir el diálogo.
  limite: Ya lo pediste hace un momento; esperá un minuto y probá de nuevo.
  denegado: No se puede volver a pedir este permiso.
  error: No se pudo volver a pedir el permiso.
# El formulario de crear, editar y borrar un evento.
editor:
  crear: Agregar evento
  tituloCrear: Nuevo evento
  tituloEditar: Evento
  titulo: Título
  tituloPlaceholder: Nombre del evento
  calendario: Calendario
  todoElDia: Todo el día
  comienzo: Comienzo
  fin: Fin
  ubicacion: Ubicación
  ubicacionPlaceholder: Dónde es
  descripcion: Descripción
  guardar: Guardar
  cancelar: Cancelar
  borrar: Borrar
  borrarConfirmar: Sí, borrar
  # Editar queda en pausa hasta que el almacén entregue el ETag del evento.
  pendiente: "Este evento todavía no se puede editar: hay que esperar a que se sincronice."
  # Cuando el evento no tiene un identificador que permita borrarlo.
  noSePuede: No se pudo identificar el evento.
  faltaTitulo: Poné un título.
  faltaCalendario: Elegí un calendario.
  fechaInvalida: Revisá las fechas.
  rangoInvalido: El evento termina antes de empezar.
# El indicador de sincronización por evento, en el mes, la agenda y las columnas.
sincronizacion:
  pendiente: Sin sincronizar
  conflicto: En conflicto
# La vista de resolver un conflicto: la versión local y la del servidor, con las
# dos acciones para resolverlo.
conflicto:
  titulo: Resolver conflicto
  # El aviso en el formulario de un evento en conflicto.
  tituloEvento: Este evento está en conflicto
  descripcionEvento: Tu versión y la del servidor no coinciden. Resolvelo para poder editarlo.
  # El mismo aviso, en el formulario de una tarea en conflicto.
  tituloTarea: Esta tarea está en conflicto
  descripcionTarea: Tu versión y la del servidor no coinciden. Resolvela para poder editarla.
  resolver: Resolver
  ayuda: Elegí con cuál versión quedarte. La otra se descarta.
  local: Mi versión
  servidor: Versión del servidor
  mantenerLaMia: Mantener la mía
  tomarLaDelServidor: Tomar la del servidor
  servidorNoDisponible: La copia del servidor todavía no está disponible. Cerrá y probá de nuevo más tarde.
  reintentarNota: Cerrá y probá de nuevo más tarde.
  borradoLocal: Tu cambio es borrar este evento.
  cargando: Buscando las dos versiones…
  noSePudoCargar: No se pudo traer la comparación
  yaResuelto: Este conflicto ya está resuelto.
  cerrar: Cerrar
  campoResumen: Título
  campoComienzo: Comienzo
  campoFin: Fin
  campoUbicacion: Ubicación
# El selector de parte: el calendario o las tareas.
modo:
  label: Parte
  calendario: Calendario
  tareas: Tareas
# La vista de tareas: la lista y el formulario de crear, editar y borrar.
tareas:
  crear: Agregar tarea
  tituloCrear: Nueva tarea
  tituloEditar: Tarea
  titulo: Título
  tituloPlaceholder: Nombre de la tarea
  lista: Lista
  estadoLabel: Estado
  prioridadLabel: Prioridad
  conVencimiento: Con vencimiento
  todoElDia: Todo el día
  vencimiento: Vencimiento
  descripcion: Descripción
  guardar: Guardar
  cancelar: Cancelar
  borrar: Borrar
  borrarConfirmar: Sí, borrar
  verCompletadas: Ver completadas
  cargando: Buscando tareas…
  completar: Marcar como hecha
  sinTitulo: (sin título)
  # Editar queda en pausa hasta que el almacén entregue el ETag de la tarea.
  pendiente: "Esta tarea todavía no se puede editar: hay que esperar a que se sincronice."
  # Cuando la tarea no tiene un identificador que permita editarla o borrarla.
  noSePuede: No se pudo identificar la tarea.
  faltaTitulo: Poné un título.
  faltaCalendario: Elegí una lista.
  fechaInvalida: Revisá el vencimiento.
  # Cuando el almacén todavía no tiene ninguna lista de tareas.
  sinListasTitulo: Todavía no hay ninguna lista de tareas
  sinListasNota: Conectá una cuenta con tareas desde Configuración y aparecen acá.
  # Cuando hay listas pero ninguna tarea.
  vacioTitulo: No hay tareas
  vacioNota: Agregá una con el botón de arriba.
  vacioPendientesNota: No hay tareas pendientes. Prendé «Ver completadas» para ver las hechas.
  # Los cuatro estados de una tarea.
  estado:
    NEEDS-ACTION: Pendiente
    IN-PROCESS: En curso
    COMPLETED: Completada
    CANCELLED: Cancelada
  # Las prioridades que se pueden elegir.
  prioridad:
    none: Sin prioridad
    high: Alta
    medium: Media
    low: Baja
