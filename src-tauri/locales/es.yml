_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Calendario
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
calendario:
  hoy: Hoy
  mesAnterior: Mes anterior
  mesSiguiente: Mes siguiente
  cargando: Buscando eventos…
  actualizar: Actualizar
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  eventosDelDia: "{0}: {1}"
  todoElDia: Todo el día
  sinTitulo: (sin título)
  seRepite: Se repite
  # Decirlo es parte de la función: un evento semanal que se ve una sola vez,
  # sin avisar, hace creer que las demás semanas están libres.
  seRepiteDetalle: Por ahora se muestra sólo el día que empieza.
  escritoEn: "Escrito en la hora de {0}"
  zonaEtiqueta: "Zona horaria de la agenda"
  zonaAyuda: "En qué hora se muestran los eventos"
  zonaDelSistema: "La del sistema"
  zonaBuscar: "Buscar una zona…"
  zonaSinResultados: "Ninguna zona coincide"
  viendoEn: "Viendo la hora de {0}"
  masEventosOne: "+{0} evento más"
  masEventosOther: "+{0} eventos más"
cuentas:
  titulo: Cuentas
  calendarios: Calendarios
  sinCuentasTitulo: Todavía no hay ningún calendario
  sinCuentasDescripcion: Conectá una cuenta desde Configuración y sus calendarios aparecen acá.
  necesitaReconectarse: Hay que volver a conectarla desde Configuración
  noSePudoLeerTodo: No se pudo leer todo
