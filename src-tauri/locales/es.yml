_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Calendario
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
calendario:
  hoy: Hoy
  mesAnterior: Mes anterior
  mesSiguiente: Mes siguiente
  cargando: Buscando eventos…
  actualizar: Actualizar
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  eventosDelDia: "{0}: {1}"
  todoElDia: Todo el día
  sinTitulo: (sin título)
  recurring: Se repite
  # Decirlo es parte de la función: una serie que se ve una sola vez, sin
  # avisar, hace creer que las demás semanas están libres.
  shownOnce: "La regla de repetición no se pudo leer: se muestra sólo el día que empieza."
  escritoEn: "Escrito en la hora de {0}"
  zonaEtiqueta: "Zona horaria de la agenda"
  zonaAyuda: "En qué hora se muestran los eventos"
  zonaDelSistema: "La del sistema"
  zonaBuscar: "Buscar una zona…"
  zonaSinResultados: "Ninguna zona coincide"
  viendoEn: "Viendo la hora de {0}"
  masEventosOne: "+{0} evento más"
  masEventosOther: "+{0} eventos más"
  sinEventos: Sin eventos
  conEventos: "{0}, con eventos"
cuentas:
  titulo: Cuentas
  calendarios: Calendarios
  sinCuentasTitulo: Todavía no hay ningún calendario
  sinCuentasDescripcion: Conectá una cuenta desde Configuración y sus calendarios aparecen acá.
  necesitaReconectarse: Hay que volver a conectarla desde Configuración
  noSePudoLeerTodo: No se pudo leer todo
# Cómo va la sincronización de cada cuenta, en el panel de cuentas.
sync:
  pending: Esperando para sincronizar
  syncing: Sincronizando…
  synced: Al día
  syncedAt: "Al día · {0}"
  failed: "No se pudo sincronizar: {0}"
  unavailable: "No disponible: {0}"
  request:
    denied: No diste permiso para sincronizar esta cuenta
    too_soon: Se acaba de actualizar; en un momento se puede de nuevo
    unavailable: El servicio de sincronización no está funcionando
    failed: No se pudo pedir la sincronización
# El selector de vista: día, N días, semana, mes, año y agenda.
view:
  label: Vista
  day: Día
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  days: "{0} días"
  week: Semana
  month: Mes
  year: Año
  agenda: Agenda
# Los botones de ir y volver entre columnas (con la ventana angosta) y entre
# períodos (las flechas, cuando la vista no es el mes).
nav:
  accounts: Cuentas
  month: Mes
  previous: Anterior
  next: Siguiente
# El mes como lista, con la ventana angosta.
agenda:
  today: "Hoy · {0}"
  range: "{0} – {1}"
  from: "Desde las {0}"
  until: "Hasta las {0}"
  nothing: Nada para hoy
  empty: No hay eventos este mes
  emptyNote: Con las flechas de arriba se pasa a otro mes.
